<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A Tetris-inspired portfolio for a full-stack developer and automation QA engineer."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Async font CSS: never render-blocking; woff2 files fetch only where
         the families are actually used (the portfolio reading space). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;900&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="preload"
      as="style"
      onload="this.rel = 'stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;900&family=Space+Grotesk:wght@400;500;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Vinh Vu | Tetris Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
